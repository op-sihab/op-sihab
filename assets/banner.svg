<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <!-- Monochrome Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Subtle White Shimmer -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a1a1aa">
        <animate attributeName="stop-color" values="#ffffff;#a1a1aa;#ffffff;#ffffff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Monochromatic Laser Line -->
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-850,0" to="850,0" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Ambient Subtle White Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Minimalist Grid Pattern -->
    <pattern id="minimalGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#18181b" stroke-width="0.75" stroke-opacity="0.8" />
      <circle cx="0" cy="0" r="0.8" fill="#27272a" />
    </pattern>

    <style>
      .mono {
        font-family: 'SF Mono', 'Geist Mono', 'Fira Code', 'Consolas', monospace;
      }
      .display {
        font-family: 'SF Pro Display', 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      @keyframes floatMuted {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
        100% { transform: translateY(0px); }
      }
      .anim-float {
        animation: floatMuted 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Outer Shell with Hairline Border (Double-Bezel Architecture) -->
  <rect width="850" height="220" rx="14" fill="url(#bg)" stroke="#27272a" stroke-width="1" />

  <!-- Inner Subtle Inset Frame -->
  <rect x="5" y="5" width="840" height="210" rx="10" fill="none" stroke="#18181b" stroke-width="1" />

  <!-- Geometric Grid Layer -->
  <rect x="6" y="6" width="838" height="208" rx="9" fill="url(#minimalGrid)" />

  <!-- Soft Central Diffused Light -->
  <circle cx="425" cy="110" r="220" fill="url(#centerGlow)" />

  <!-- Corner Precision Crosshairs -->
  <path d="M 20 28 L 20 20 L 28 20" stroke="#52525b" stroke-width="1" fill="none" />
  <path d="M 830 28 L 830 20 L 822 20" stroke="#52525b" stroke-width="1" fill="none" />
  <path d="M 20 192 L 20 200 L 28 200" stroke="#52525b" stroke-width="1" fill="none" />
  <path d="M 830 192 L 830 200 L 822 200" stroke="#52525b" stroke-width="1" fill="none" />

  <!-- Main Content Cluster -->
  <g class="anim-float">
    <!-- Status Pill Badge -->
    <g transform="translate(425, 42)">
      <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#121214" stroke="#27272a" stroke-width="1" />
      
      <!-- Pulsing Monochrome Dot -->
      <circle cx="-118" cy="0" r="3.5" fill="#ffffff">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="-118" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="0.75">
        <animate attributeName="r" values="3.5;8;3.5" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
      </circle>

      <text x="-105" y="4" fill="#a1a1aa" font-size="10.5" font-weight="600" class="mono" letter-spacing="1.8">
        AVAILABLE FOR BUILD &amp; SHIP
      </text>
    </g>

    <!-- Name: MD SIHAB HOSSEN -->
    <text x="425" y="108" text-anchor="middle" font-size="38" font-weight="800" class="display" fill="url(#textShimmer)" letter-spacing="4">
      MD SIHAB HOSSEN
    </text>

    <!-- Subtitle: Clean Editorial Monospace -->
    <text x="425" y="142" text-anchor="middle" font-size="13" font-weight="500" class="mono" fill="#71717a" letter-spacing="2.8">
      FULL-STACK ARCHITECT &amp; SOFTWARE CRAFTSMAN
    </text>

    <!-- Tech Stacks Muted Footer Row -->
    <g transform="translate(425, 175)">
      <text x="-220" y="0" text-anchor="middle" font-size="11" font-weight="500" class="mono" fill="#e4e4e7">TYPESCRIPT</text>
      <text x="-160" y="0" text-anchor="middle" font-size="11" fill="#3f3f46">/</text>
      <text x="-105" y="0" text-anchor="middle" font-size="11" font-weight="500" class="mono" fill="#e4e4e7">REACT &amp; NEXT.JS</text>
      <text x="-40" y="0" text-anchor="middle" font-size="11" fill="#3f3f46">/</text>
      <text x="5" y="0" text-anchor="middle" font-size="11" font-weight="500" class="mono" fill="#e4e4e7">NODE.JS</text>
      <text x="50" y="0" text-anchor="middle" font-size="11" fill="#3f3f46">/</text>
      <text x="95" y="0" text-anchor="middle" font-size="11" font-weight="500" class="mono" fill="#e4e4e7">PYTHON</text>
      <text x="145" y="0" text-anchor="middle" font-size="11" fill="#3f3f46">/</text>
      <text x="210" y="0" text-anchor="middle" font-size="11" font-weight="500" class="mono" fill="#e4e4e7">DISTRIBUTED SYSTEMS</text>
    </g>
  </g>

  <!-- Bottom Hairline Laser Bar -->
  <line x1="10" y1="217" x2="840" y2="217" stroke="#18181b" stroke-width="1" />
  <rect x="0" y="216" width="850" height="2" fill="url(#laser)" />
</svg>
