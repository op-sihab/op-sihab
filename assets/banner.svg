<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <!-- Rich Midnight / Modern Developer Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant Gradient for Title Text -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Animated Shimmering Laser Border -->
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-850,0" to="850,0" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Radial Cyan Accent -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Radial Purple Accent -->
    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <style>
      .mono-fira {
        font-family: 'Fira Code', Consolas, Monaco, 'SF Mono', monospace;
      }
      .display-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .floating-core {
        animation: floatSoft 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="850" height="200" rx="16" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Light Blobs -->
  <circle cx="200" cy="70" r="140" fill="url(#cyanOrb)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="680" cy="130" r="150" fill="url(#purpleOrb)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Content Group -->
  <g class="floating-core">
    <!-- Status Pill -->
    <g transform="translate(425, 38)">
      <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      
      <!-- Green Pulsing Beacon -->
      <circle cx="-118" cy="0" r="3.5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="-118" cy="0" r="6" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="3.5;8;3.5" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite" />
      </circle>

      <text x="-105" y="4" fill="#94a3b8" font-size="10.5" font-weight="600" class="mono-fira" letter-spacing="1.5">
        ONLINE • FULL-STACK ENGINEER
      </text>
    </g>

    <!-- Main Title -->
    <text x="425" y="98" text-anchor="middle" font-size="38" font-weight="900" class="display-sans" fill="url(#titleGradient)" letter-spacing="2">
      MD SIHAB HOSSEN
    </text>

    <!-- Tagline -->
    <text x="425" y="130" text-anchor="middle" font-size="14" font-weight="500" class="mono-fira" fill="#cbd5e1" letter-spacing="2">
      CRAFTING MODERN WEB APPS • SCALABLE APIS • AI AGENTS
    </text>

    <!-- Tech Stack Accents -->
    <g transform="translate(425, 162)">
      <text x="-190" y="0" text-anchor="middle" font-size="11.5" font-weight="600" class="mono-fira" fill="#38bdf8">TYPESCRIPT</text>
      <text x="-125" y="0" text-anchor="middle" font-size="11.5" fill="#475569">•</text>
      <text x="-65" y="0" text-anchor="middle" font-size="11.5" font-weight="600" class="mono-fira" fill="#60a5fa">REACT &amp; NEXT.JS</text>
      <text x="5" y="0" text-anchor="middle" font-size="11.5" fill="#475569">•</text>
      <text x="70" y="0" text-anchor="middle" font-size="11.5" font-weight="600" class="mono-fira" fill="#34d399">NODE.JS</text>
      <text x="130" y="0" text-anchor="middle" font-size="11.5" fill="#475569">•</text>
      <text x="190" y="0" text-anchor="middle" font-size="11.5" font-weight="600" class="mono-fira" fill="#fbbf24">PYTHON</text>
    </g>
  </g>

  <!-- Bottom Laser Shimmer Accent -->
  <rect x="0" y="196" width="850" height="4" rx="2" fill="url(#laserGlow)" />
</svg>
