<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .tag { font-size: 13px; font-weight: 600; letter-spacing: 2px; }
    .title { font-size: 50px; font-weight: 800; letter-spacing: -0.5px; }
    .subtitle { font-size: 18px; font-weight: 400; fill: #94A3B8; }
    .pill-text { font-size: 12px; font-weight: 600; fill: #E2E8F0; }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />
  
  <!-- Ambient Radial Glows -->
  <rect width="1200" height="340" rx="16" fill="url(#glowCyan)" />
  <rect width="1200" height="340" rx="16" fill="url(#glowViolet)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Terminal Header Bar -->
  <path d="M 1 17 C 1 8.163 8.163 1 17 1 L 1183 1 C 1191.837 1 1199 8.163 1199 17 L 1199 42 L 1 42 Z" fill="#0B1120" fill-opacity="0.8" />
  <line x1="1" y1="42" x2="1199" y2="42" stroke="#1E293B" stroke-width="1" />
  
  <!-- Terminal Window Controls -->
  <circle cx="28" cy="22" r="5.5" fill="#EF4444" />
  <circle cx="46" cy="22" r="5.5" fill="#F59E0B" />
  <circle cx="64" cy="22" r="5.5" fill="#10B981" />

  <text x="50%" y="26" text-anchor="middle" class="mono" font-size="12" fill="#64748B" font-weight="500">opsihab660@workspace ~ (fullstack-developer)</text>
  
  <rect x="1100" y="14" width="76" height="18" rx="9" fill="#1E293B" />
  <circle cx="1112" cy="23" r="3" fill="#10B981" />
  <text x="1122" y="27" class="mono" font-size="10" font-weight="600" fill="#94A3B8">ONLINE</text>

  <!-- Left Accent Tech Line -->
  <line x1="70" y1="95" x2="70" y2="280" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Main Hero Content -->
  <!-- Tagline -->
  <text x="96" y="112" class="mono tag" fill="#38BDF8">// HELLO WORLD, WELCOME TO MY CRAFT</text>

  <!-- Name / Main Headline -->
  <text x="96" y="172" class="sans title" fill="url(#textGrad)" filter="url(#softGlow)">Md Sihab Hossen</text>

  <!-- Subtitle -->
  <text x="96" y="210" class="sans subtitle">Full-Stack Engineer &bull; Autonomous AI Systems &bull; High-Performance Web Architect</text>

  <!-- Feature Skill Pills inside Banner -->
  <!-- Pill 1: TypeScript -->
  <g transform="translate(96, 245)">
    <rect width="115" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#38BDF8" />
    <text x="32" y="21" class="mono pill-text">TypeScript</text>
  </g>

  <!-- Pill 2: Python -->
  <g transform="translate(223, 245)">
    <rect width="95" height="34" rx="17" fill="#1E293B" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#818CF8" />
    <text x="32" y="21" class="mono pill-text">Python</text>
  </g>

  <!-- Pill 3: React / Next.js -->
  <g transform="translate(330, 245)">
    <rect width="145" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#38BDF8" />
    <text x="32" y="21" class="mono pill-text">React / Next.js</text>
  </g>

  <!-- Pill 4: Node.js & APIs -->
  <g transform="translate(487, 245)">
    <rect width="140" height="34" rx="17" fill="#1E293B" stroke="#22C55E" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#22C55E" />
    <text x="32" y="21" class="mono pill-text">Node.js &amp; APIs</text>
  </g>

  <!-- Pill 5: AI & Automation -->
  <g transform="translate(639, 245)">
    <rect width="150" height="34" rx="17" fill="#1E293B" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="17" r="4" fill="#A855F7" />
    <text x="32" y="21" class="mono pill-text">AI &amp; Automation</text>
  </g>

  <!-- Right Side Decorative Isometric Geometric / Tech Emblem -->
  <g transform="translate(970, 85)" opacity="0.85">
    <!-- Outer Hex / Tech ring -->
    <circle cx="90" cy="90" r="75" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="90" cy="90" r="55" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="90" cy="90" r="35" fill="url(#bgGrad)" stroke="#818CF8" stroke-width="2" />
    
    <!-- Code brackets icon -->
    <path d="M 80 80 L 70 90 L 80 100" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 100 80 L 110 90 L 100 100" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 93 77 L 87 103" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" />
    
    <!-- Orbiting nodes -->
    <circle cx="165" cy="90" r="4" fill="#38BDF8" />
    <circle cx="45" cy="140" r="3" fill="#818CF8" />
    <circle cx="130" cy="30" r="3" fill="#22C55E" />
  </g>
</svg>
