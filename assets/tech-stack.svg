<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <style>
      .tech-mono {
        font-family: 'SF Mono', 'Geist Mono', 'Fira Code', 'Consolas', monospace;
      }
      @keyframes floatCard {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      .card-1 { animation: floatCard 4s ease-in-out infinite 0.0s; }
      .card-2 { animation: floatCard 4s ease-in-out infinite 0.3s; }
      .card-3 { animation: floatCard 4s ease-in-out infinite 0.6s; }
      .card-4 { animation: floatCard 4s ease-in-out infinite 0.9s; }
      .card-5 { animation: floatCard 4s ease-in-out infinite 1.2s; }
      .card-6 { animation: floatCard 4s ease-in-out infinite 0.2s; }
      .card-7 { animation: floatCard 4s ease-in-out infinite 0.5s; }
      .card-8 { animation: floatCard 4s ease-in-out infinite 0.8s; }
      .card-9 { animation: floatCard 4s ease-in-out infinite 1.1s; }
      .card-10 { animation: floatCard 4s ease-in-out infinite 1.4s; }

      .card-base {
        fill: #121214;
        stroke: #27272a;
        stroke-width: 1px;
        transition: all 0.3s ease;
      }
      .card-text {
        fill: #e4e4e7;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .icon-fill {
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Container Box (Double Bezel Stealth Card) -->
  <rect width="850" height="160" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1" />
  <rect x="4" y="4" width="842" height="152" rx="10" fill="none" stroke="#18181b" stroke-width="1" />

  <!-- Eyebrow Category Header -->
  <text x="24" y="28" fill="#71717a" font-size="10.5" font-weight="600" class="tech-mono" letter-spacing="1.5">
    STACK &amp; RUNTIMES / MONOCHROME SUITE
  </text>
  <line x1="280" y1="24" x2="826" y2="24" stroke="#18181b" stroke-width="1" />

  <!-- ==================== ROW 1: CORE RUNTIMES ==================== -->

  <!-- 1. TypeScript -->
  <g class="card-1" transform="translate(24, 44)">
    <rect width="145" height="42" rx="8" class="card-base" />
    <!-- TS icon -->
    <path class="icon-fill" d="M16 13h16v16H16z" fill="#18181b" />
    <path fill="#ffffff" d="M22.5 18h-4.5v2h1.4v7h1.7v-7h1.4v-2zm7 3.5c-.3-.4-.8-.7-1.4-.9l-.6-.2c-.4-.1-.6-.3-.6-.5s.2-.4.5-.4c.4 0 .7.2.9.5l1.3-.9c-.5-.7-1.2-1-2.2-1-1.3 0-2.3.8-2.3 2 0 .8.5 1.4 1.4 1.7l.6.2c.5.2.8.4.8.7 0 .3-.3.5-.7.5-.5 0-.9-.3-1.2-.7l-1.3.9c.5.9 1.4 1.3 2.5 1.3 1.5 0 2.5-.8 2.5-2.2 0-.8-.5-1.4-1.3-1.7z" />
    <text x="48" y="26" class="card-text tech-mono">TypeScript</text>
  </g>

  <!-- 2. JavaScript -->
  <g class="card-2" transform="translate(187, 44)">
    <rect width="145" height="42" rx="8" class="card-base" />
    <!-- JS icon -->
    <path class="icon-fill" d="M16 13h16v16H16z" fill="#18181b" />
    <path fill="#ffffff" d="M22.7 25.5c-.3.5-.8.8-1.5.8-.9 0-1.4-.5-1.4-1.5v-4.6h1.7v4.4c0 .3.1.5.4.5.3 0 .5-.2.6-.5l.2.9zm6.6-1.8c-.3-.4-.7-.6-1.3-.8l-.5-.2c-.4-.1-.5-.3-.5-.5s.2-.3.5-.3c.4 0 .6.2.8.4l1.2-.9c-.5-.6-1.1-.9-2-.9-1.2 0-2.1.7-2.1 1.8 0 .7.4 1.3 1.2 1.5l.6.2c.4.1.7.3.7.6 0 .3-.3.5-.6.5-.4 0-.8-.2-1-.6l-1.2.9c.5.8 1.2 1.2 2.2 1.2 1.3 0 2.3-.7 2.3-2 0-.7-.4-1.3-1.2-1.5z" />
    <text x="48" y="26" class="card-text tech-mono">JavaScript</text>
  </g>

  <!-- 3. Python -->
  <g class="card-3" transform="translate(350, 44)">
    <rect width="145" height="42" rx="8" class="card-base" />
    <!-- Python Icon -->
    <path fill="#ffffff" d="M24 13c-4.4 0-4.1 1.9-4.1 1.9l.01 2h4.2v.6h-5.9s-2.8-.3-2.8 4.1 2.5 4.3 2.5 4.3h1.5v-2.1s-.1-2.5 2.5-2.5h4.2s2.4.04 2.4-2.3v-3.7s.3-2.3-4.5-2.3zm-1.3 1.3c.4 0 .7.3.7.7s-.3.7-.7.7-.7-.3-.7-.7.3-.7.7-.7zm1.3 14.7c4.4 0 4.1-1.9 4.1-1.9l-.01-2h-4.2v-.6h5.9s2.8.3 2.8-4.1-2.5-4.3-2.5-4.3h-1.5v2.1s.1 2.5-2.5 2.5h-4.2s-2.4-.04-2.4 2.3v3.7s-.3 2.3 4.5 2.3zm1.3-1.3c-.4 0-.7-.3-.7-.7s.3-.7.7-.7.7.3.7.7-.3.7-.7.7z" />
    <text x="48" y="26" class="card-text tech-mono">Python</text>
  </g>

  <!-- 4. React -->
  <g class="card-4" transform="translate(513, 44)">
    <rect width="145" height="42" rx="8" class="card-base" />
    <!-- React Icon -->
    <ellipse cx="25" cy="21" rx="8" ry="3" fill="none" stroke="#ffffff" stroke-width="1.2" transform="rotate(30 25 21)" />
    <ellipse cx="25" cy="21" rx="8" ry="3" fill="none" stroke="#ffffff" stroke-width="1.2" transform="rotate(90 25 21)" />
    <ellipse cx="25" cy="21" rx="8" ry="3" fill="none" stroke="#ffffff" stroke-width="1.2" transform="rotate(150 25 21)" />
    <circle cx="25" cy="21" r="1.5" fill="#ffffff" />
    <text x="48" y="26" class="card-text tech-mono">React</text>
  </g>

  <!-- 5. Next.js -->
  <g class="card-5" transform="translate(676, 44)">
    <rect width="150" height="42" rx="8" class="card-base" />
    <!-- Next.js Icon -->
    <circle cx="25" cy="21" r="8" fill="#18181b" stroke="#ffffff" stroke-width="1" />
    <path fill="#ffffff" d="M22 17h1.8l4.4 6.2V17H30v8h-1.6L23.8 18.6V25H22z" />
    <text x="48" y="26" class="card-text tech-mono">Next.js</text>
  </g>

  <!-- ==================== ROW 2: FRAMEWORKS & BACKEND ==================== -->

  <!-- 6. Node.js -->
  <g class="card-6" transform="translate(24, 98)">
    <rect width="145" height="42" rx="8" class="card-base" />
    <!-- Node.js Hexagon -->
    <path fill="#ffffff" d="M25 13l7 4v8l-7 4-7-4v-8z" fill-opacity="0.1" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="25" cy="21" r="2.5" fill="#ffffff" />
    <text x="48" y="26" class="card-text tech-mono">Node.js</text>
  </g>

  <!-- 7. Tailwind CSS -->
  <g class="card-7" transform="translate(187, 98)">
    <rect width="145" height="42" rx="8" class="card-base" />
    <!-- Tailwind Waves -->
    <path fill="#ffffff" d="M20.5 19.5c.8-1.7 2.2-2.5 4-2.5 2.8 0 3.7 2 4.4 3.2.7 1.1 1.3 1.8 2.6 1.8 1.4 0 2.3-.9 2.9-2-1 .9-2.1 1.3-3.2 1.3-2.3 0-3.3-2-4.1-3.2-.6-1-1.3-1.8-2.6-1.8-1.7 0-2.8 1.1-4 3.2zm-4 4c.8-1.7 2.2-2.5 4-2.5 2.8 0 3.7 2 4.4 3.2.7 1.1 1.3 1.8 2.6 1.8 1.4 0 2.3-.9 2.9-2-1 .9-2.1 1.3-3.2 1.3-2.3 0-3.3-2-4.1-3.2-.6-1-1.3-1.8-2.6-1.8-1.7 0-2.8 1.1-4 3.2z" />
    <text x="48" y="26" class="card-text tech-mono">Tailwind</text>
  </g>

  <!-- 8. PostgreSQL -->
  <g class="card-8" transform="translate(350, 98)">
    <rect width="145" height="42" rx="8" class="card-base" />
    <!-- Database Cylinder -->
    <ellipse cx="25" cy="17" rx="6" ry="2.2" fill="none" stroke="#ffffff" stroke-width="1.2" />
    <path d="M19 17v7c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2v-7" fill="none" stroke="#ffffff" stroke-width="1.2" />
    <path d="M19 21c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2" fill="none" stroke="#ffffff" stroke-width="1.2" />
    <text x="48" y="26" class="card-text tech-mono">PostgreSQL</text>
  </g>

  <!-- 9. Docker -->
  <g class="card-9" transform="translate(513, 98)">
    <rect width="145" height="42" rx="8" class="card-base" />
    <!-- Docker Whale/Containers -->
    <rect x="18" y="19" width="3" height="2.5" fill="#ffffff" />
    <rect x="22" y="19" width="3" height="2.5" fill="#ffffff" />
    <rect x="26" y="19" width="3" height="2.5" fill="#ffffff" />
    <rect x="22" y="15.5" width="3" height="2.5" fill="#ffffff" />
    <rect x="26" y="15.5" width="3" height="2.5" fill="#ffffff" />
    <path fill="#ffffff" d="M32 21.5c-.3-.2-1-.2-1.3 0-.1.7-.5 1.3-1.1 1.7-1.3.8-3.7.8-5.6.8-2.7 0-5.1-.9-6.3-2.6-.3-.4-.7-.4-.7-.4-.4.8-.4 2.4.6 3.4 1.5 1.5 4.3 2.1 7.2 2.1 4.5 0 7.8-1.7 8.2-4.5.3 0 .7-.3.8-.5-.4-.3-1.2-.3-1.8 0z" />
    <text x="48" y="26" class="card-text tech-mono">Docker</text>
  </g>

  <!-- 10. Git -->
  <g class="card-10" transform="translate(676, 98)">
    <rect width="150" height="42" rx="8" class="card-base" />
    <!-- Git Branch icon -->
    <circle cx="21" cy="18" r="2" fill="#ffffff" />
    <circle cx="21" cy="26" r="2" fill="#ffffff" />
    <circle cx="28" cy="20" r="2" fill="#ffffff" />
    <line x1="21" y1="20" x2="21" y2="24" stroke="#ffffff" stroke-width="1.2" />
    <path d="M21 24c0-2.5 3.5-2.5 7-4" fill="none" stroke="#ffffff" stroke-width="1.2" />
    <text x="48" y="26" class="card-text tech-mono">Git &amp; CI/CD</text>
  </g>
</svg>
