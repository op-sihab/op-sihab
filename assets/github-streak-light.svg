<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <style>
      .num {
        font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 28px;
        text-anchor: middle;
      }
      .lbl {
        font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif;
        font-weight: 400;
        font-size: 14px;
        text-anchor: middle;
      }
      .lbl-curr {
        font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 14px;
        text-anchor: middle;
      }
      .dt {
        font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif;
        font-weight: 400;
        font-size: 12px;
        text-anchor: middle;
      }
      @keyframes flamePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      .flame {
        transform-origin: 247.5px 38px;
        animation: flamePulse 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="495" height="195" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />

  <!-- Dividers -->
  <line x1="170" y1="40" x2="170" y2="160" stroke="#D0D7DE" stroke-width="1" />
  <line x1="325" y1="40" x2="325" y2="160" stroke="#D0D7DE" stroke-width="1" />

  <!-- Total Contributions Column -->
  <g transform="translate(85, 0)">
    <text x="0" y="80" class="num" fill="#0969DA">310</text>
    <text x="0" y="112" class="lbl" fill="#656D76">Total Contributions</text>
    <text x="0" y="140" class="dt" fill="#1A7F37">May 17 - Present</text>
  </g>

  <!-- Current Streak Column -->
  <g transform="translate(247.5, 0)">
    <!-- Ring -->
    <circle cx="0" cy="74" r="38" fill="none" stroke="#0969DA" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Flame Icon atop ring -->
    <g class="flame" transform="translate(-12, 18)">
      <path fill="#D97706" d="M12 2C9.5 5 7 7.5 7 11a5 5 0 0 0 10 0c0-3.5-2.5-6-5-9zm0 13a3 3 0 0 1-3-3c0-1.5 1-2.8 2-3.8.4.8 1 1.5 1.5 2.2.4-.6.8-1.4.9-2.4 1 1.2 1.6 2.5 1.6 4a3 3 0 0 1-3 3z" />
    </g>

    <text x="0" y="83" class="num" fill="#8250DF">4</text>
    <text x="0" y="132" class="lbl-curr" fill="#0969DA">Current Streak</text>
    <text x="0" y="156" class="dt" fill="#1A7F37">Sep 26 - Sep 29</text>
  </g>

  <!-- Longest Streak Column -->
  <g transform="translate(410, 0)">
    <text x="0" y="80" class="num" fill="#0969DA">5</text>
    <text x="0" y="112" class="lbl" fill="#656D76">Longest Streak</text>
    <text x="0" y="140" class="dt" fill="#1A7F37">Aug 28 - Sep 1</text>
  </g>
</svg>