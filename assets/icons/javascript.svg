<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes shimmerJS {
        0%, 100% { fill: #ffffff; }
        50% { fill: #a1a1aa; }
      }
      .container { animation: floatIcon 3.5s ease-in-out infinite 0.4s; }
      .js-text { animation: shimmerJS 3s ease-in-out infinite 0.4s; }
    </style>
  </defs>
  <g class="container">
    <rect width="64" height="64" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.2" />
    <rect x="4" y="4" width="56" height="56" rx="10" fill="#121214" />
    <!-- JavaScript Badge -->
    <path class="js-text" d="M21.5 37.5c-.6.9-1.5 1.5-2.8 1.5-1.7 0-2.6-.9-2.6-2.8V28h3v8c0 .5.2.8.7.8.5 0 .9-.3 1.1-.9l.6 1.6zm12.5-3.3c-.6-.7-1.4-1.1-2.4-1.5l-1-.4c-.7-.3-1-.6-1-1s.4-.6 1-.6c.7 0 1.2.3 1.5.7l2.2-1.7c-1-1.2-2.1-1.7-3.8-1.7-2.3 0-3.9 1.4-3.9 3.4 0 1.4.8 2.5 2.3 3l1.1.4c.8.3 1.3.6 1.3 1.1 0 .6-.6 1-1.2 1-.8 0-1.5-.4-1.9-1.1l-2.3 1.7c1 1.5 2.3 2.3 4.2 2.3 2.5 0 4.3-1.4 4.3-3.8 0-1.4-.8-2.4-2.2-2.8z" />
    <!-- Label -->
    <text x="32" y="52" text-anchor="middle" font-family="'SF Mono', 'Geist Mono', monospace" font-size="7" font-weight="600" fill="#71717a" letter-spacing="1">JS</text>
  </g>
</svg>
