<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes spinOrbitals {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .container { animation: floatIcon 3.5s ease-in-out infinite 1.2s; }
      .atom-core {
        transform-origin: 32px 29px;
        animation: spinOrbitals 12s linear infinite;
      }
    </style>
  </defs>
  <g class="container">
    <rect width="64" height="64" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.2" />
    <rect x="4" y="4" width="56" height="56" rx="10" fill="#121214" />
    
    <!-- React Logo with Spinning Orbitals -->
    <g class="atom-core">
      <ellipse cx="32" cy="29" rx="11" ry="4.2" fill="none" stroke="#ffffff" stroke-width="1.3" />
      <ellipse cx="32" cy="29" rx="11" ry="4.2" fill="none" stroke="#e4e4e7" stroke-width="1.3" transform="rotate(60 32 29)" />
      <ellipse cx="32" cy="29" rx="11" ry="4.2" fill="none" stroke="#a1a1aa" stroke-width="1.3" transform="rotate(120 32 29)" />
    </g>
    <circle cx="32" cy="29" r="2.2" fill="#ffffff" />
    
    <!-- Label -->
    <text x="32" y="52" text-anchor="middle" font-family="'SF Mono', 'Geist Mono', monospace" font-size="7" font-weight="600" fill="#71717a" letter-spacing="1">REACT</text>
  </g>
</svg>
