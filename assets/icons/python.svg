<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseSnake {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      .container { animation: floatIcon 3.5s ease-in-out infinite 0.8s; }
      .python-glyph { 
        transform-origin: 32px 30px;
        animation: pulseSnake 4s ease-in-out infinite; 
      }
    </style>
  </defs>
  <g class="container">
    <rect width="64" height="64" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.2" />
    <rect x="4" y="4" width="56" height="56" rx="10" fill="#121214" />
    <!-- Python Icon in Monochrome -->
    <g class="python-glyph">
      <path fill="#ffffff" d="M31.8 17c-6.2 0-5.8 2.7-5.8 2.7l.01 2.8h5.9v.9h-8.3s-3.9-.4-3.9 5.8 3.5 6 3.5 6h2.1v-3s-.1-3.5 3.5-3.5h5.9s3.4.1 3.4-3.2v-5.2s.4-3.3-6.3-3.3zm-1.8 1.8c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1z" />
      <path fill="#a1a1aa" d="M32.2 43c6.2 0 5.8-2.7 5.8-2.7l-.01-2.8h-5.9v-.9h8.3s3.9.4 3.9-5.8-3.5-6-3.5-6h-2.1v3s.1 3.5-3.5 3.5h-5.9s-3.4-.1-3.4 3.2v5.2s-.4 3.3 6.3 3.3zm1.8-1.8c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z" />
    </g>
    <!-- Label -->
    <text x="32" y="52" text-anchor="middle" font-family="'SF Mono', 'Geist Mono', monospace" font-size="7" font-weight="600" fill="#71717a" letter-spacing="1">PYTHON</text>
  </g>
</svg>
