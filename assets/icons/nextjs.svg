<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes nextShimmer {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; stroke: #ffffff; }
      }
      .container { animation: floatIcon 3.5s ease-in-out infinite 1.6s; }
      .next-border { animation: nextShimmer 3s ease-in-out infinite; }
    </style>
    <linearGradient id="nextGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>
  <g class="container">
    <rect width="64" height="64" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.2" />
    <rect x="4" y="4" width="56" height="56" rx="10" fill="#121214" />
    
    <!-- Next.js Logo -->
    <circle cx="32" cy="29" r="12" fill="#000000" stroke="#3f3f46" stroke-width="1.2" class="next-border" />
    <path fill="#ffffff" d="M28 23h2.2v12H28z" />
    <path fill="url(#nextGrad)" d="M30.2 23.3l7 10.4h-2.4l-5.6-8.6z" />
    <path fill="#ffffff" d="M34.8 23h2.2v6.2h-2.2z" />
    
    <!-- Label -->
    <text x="32" y="52" text-anchor="middle" font-family="'SF Mono', 'Geist Mono', monospace" font-size="7" font-weight="600" fill="#71717a" letter-spacing="1">NEXT.JS</text>
  </g>
</svg>
