<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes dbGlow {
        0%, 100% { stroke: #52525b; }
        50% { stroke: #ffffff; }
      }
      .container { animation: floatIcon 3.5s ease-in-out infinite 1.1s; }
      .db-ring { animation: dbGlow 3s ease-in-out infinite; }
    </style>
  </defs>
  <g class="container">
    <rect width="64" height="64" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.2" />
    <rect x="4" y="4" width="56" height="56" rx="10" fill="#121214" />
    
    <!-- Database Stack -->
    <ellipse cx="32" cy="22" rx="9" ry="3.3" fill="none" stroke="#ffffff" stroke-width="1.4" />
    <path d="M23 22v7c0 1.8 4 3.3 9 3.3s9-1.5 9-3.3v-7" fill="none" stroke="#e4e4e7" stroke-width="1.4" />
    <path class="db-ring" d="M23 28v7c0 1.8 4 3.3 9 3.3s9-1.5 9-3.3v-7" fill="none" stroke="#71717a" stroke-width="1.4" />
    
    <!-- Label -->
    <text x="32" y="52" text-anchor="middle" font-family="'SF Mono', 'Geist Mono', monospace" font-size="7" font-weight="600" fill="#71717a" letter-spacing="1">POSTGRES</text>
  </g>
</svg>
