<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseContainers {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; fill: #ffffff; }
      }
      .container { animation: floatIcon 3.5s ease-in-out infinite 1.5s; }
      .container-box { animation: pulseContainers 3s ease-in-out infinite; }
    </style>
  </defs>
  <g class="container">
    <rect width="64" height="64" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.2" />
    <rect x="4" y="4" width="56" height="56" rx="10" fill="#121214" />
    
    <!-- Docker Whale & Containers -->
    <rect class="container-box" x="22" y="24" width="4" height="3.5" fill="#a1a1aa" />
    <rect class="container-box" x="27" y="24" width="4" height="3.5" fill="#ffffff" />
    <rect class="container-box" x="32" y="24" width="4" height="3.5" fill="#a1a1aa" />
    <rect class="container-box" x="27" y="19.5" width="4" height="3.5" fill="#a1a1aa" />
    <rect class="container-box" x="32" y="19.5" width="4" height="3.5" fill="#ffffff" />
    <path fill="#ffffff" d="M41 27.5c-.4-.3-1.4-.3-1.8 0-.1.9-.7 1.7-1.5 2.2-1.7 1-4.9 1-7.5 1-3.6 0-6.8-1.2-8.4-3.5-.4-.5-1-.5-1-.5-.5 1.1-.5 3.2.8 4.5 2 2 5.7 2.8 9.6 2.8 6 0 10.4-2.3 11-6 .4 0 .9-.4 1-.7-.5-.4-1.6-.4-2.2.2z" />
    
    <!-- Label -->
    <text x="32" y="52" text-anchor="middle" font-family="'SF Mono', 'Geist Mono', monospace" font-size="7" font-weight="600" fill="#71717a" letter-spacing="1">DOCKER</text>
  </g>
</svg>
