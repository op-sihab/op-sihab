<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes waveShimmer {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .container { animation: floatIcon 3.5s ease-in-out infinite 0.7s; }
      .wave { animation: waveShimmer 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <g class="container">
    <rect width="64" height="64" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.2" />
    <rect x="4" y="4" width="56" height="56" rx="10" fill="#121214" />
    
    <!-- Tailwind Wave -->
    <path class="wave" fill="#ffffff" d="M26.5 25.5c1.2-2.5 3.3-3.7 6-3.7 4.2 0 5.5 3 6.6 4.8 1 1.6 2 2.7 3.9 2.7 2.1 0 3.4-1.3 4.3-3-1.5 1.3-3.1 2-4.8 2-3.4 0-4.9-3-6.1-4.8-.9-1.5-2-2.7-3.9-2.7-2.5 0-4.2 1.6-6 4.7zm-6 6c1.2-2.5 3.3-3.7 6-3.7 4.2 0 5.5 3 6.6 4.8 1 1.6 2 2.7 3.9 2.7 2.1 0 3.4-1.3 4.3-3-1.5 1.3-3.1 2-4.8 2-3.4 0-4.9-3-6.1-4.8-.9-1.5-2-2.7-3.9-2.7-2.5 0-4.2 1.6-6 4.7z" />
    
    <!-- Label -->
    <text x="32" y="52" text-anchor="middle" font-family="'SF Mono', 'Geist Mono', monospace" font-size="7" font-weight="600" fill="#71717a" letter-spacing="1">TAILWIND</text>
  </g>
</svg>
